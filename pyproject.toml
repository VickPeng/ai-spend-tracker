[project]
name = "ai-spend-tracker"
version = "0.2.0"
description = "Aggregate token usage & cost across all your AI coding agents (Hermes, Codex, Claude Code, Copilot, OpenCode, OpenClaw, Kimi)"
authors = [
    {name = "vick"},
]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: Software Development :: Monitoring",
]
keywords = ["token-usage", "cost-tracking", "ai-coding-agent", "claude-code", "opencode"]
license = {text = "MIT"}
readme = "README.md"

[project.urls]
Homepage = "https://github.com/vick/ai-spend-tracker"
Repository = "https://github.com/vick/ai-spend-tracker"
"Bug Tracker" = "https://github.com/vick/ai-spend-tracker/issues"

[project.scripts]
ai-spend = "ai_spend_tracker.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_spend_tracker*"]

[tool.setuptools.license-files]
files = ["LICENSE"]
